# Processes ONE dashboard run. Dispatched only by the dashboard (workflow_dispatch API).
# No schedule, no automatic restarts, no job chaining.
#
# Time budget on standard GitHub-hosted runners (hard limit: 6 h = 360 min per job):
#   setup (checkout, npm ci, Chromium install)  ~5-8 min
#   processing budget (server-side deadline)      300 min from claim  (PROCESSING_BUDGET_MINUTES)
#   new-work cutoff before deadline                 8 min             (no new website started after that)
#   finish + cleanup                               ~2 min
#   => normal worst case ~310 min; step timeout 330; job timeout 345 (15 min under the hard limit).
# The runner exits as soon as the eligible queue is empty; it never idles to use up time.
name: outreach-run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Dashboard run ID (UUID)"
        required: true
        type: string
      campaign_id:
        description: "Campaign ID (UUID) — used for the concurrency group"
        required: true
        type: string

# One active processing job per campaign (in addition to the database constraint).
concurrency:
  group: outreach-campaign-${{ inputs.campaign_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - name: Validate inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          re='^[0-9a-fA-F-]{36}$'
          [[ "$RUN_ID" =~ $re && "$CAMPAIGN_ID" =~ $re ]] || { echo "invalid inputs"; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Process run
        timeout-minutes: 330
        env:
          RUN_ID: ${{ inputs.run_id }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          RUNNER_API_SECRET: ${{ secrets.RUNNER_API_SECRET }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: npm run runner
