# GitHub-only outreach run. Everything happens inside this one job:
# a temporary Postgres, the Playwright runner, and the durable state, which is
# saved to the private `outreach-state` branch (database JSON, screenshots, reports).
#
# Start: Actions -> outreach-run -> Run workflow -> choose mode.
# Graceful stop: Actions -> outreach-stop -> Run workflow.
# Emergency cancel: "Cancel workflow" on the running job.
# No schedule, no automatic restarts, no job chaining.
#
# Time budget (GitHub-hosted job hard limit: 6 h = 360 min):
#   setup ~5-8 min + processing budget 300 min (no new website in the last 8 min)
#   + reports/push ~2 min  =>  ~310 min; job timeout 345 min.
name: outreach-run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = everything in one go (find, check, submit) · discovery / dry_run / live = single steps"
        required: true
        type: choice
        options: [auto, discovery, dry_run, live]
        default: auto
      confirm_live:
        description: "Only for mode=live: type START LIVE (not needed for auto)"
        required: false
        type: string
        default: ""

# One job at a time for the whole outreach state (single writer of outreach-state).
concurrency:
  group: outreach-state
  cancel-in-progress: false

permissions:
  contents: write   # push the outreach-state branch
  actions: read     # detect the outreach-stop workflow
  issues: write     # live dashboard issue

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      OUTREACH_EPHEMERAL_DB: "1"
      STATE_DIR: ${{ github.workspace }}/state
      OUTREACH_MODE: ${{ inputs.mode }}
      OUTREACH_CONFIRM: ${{ inputs.confirm_live }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Open state branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin outreach-state >/dev/null; then
            git fetch --depth=1 origin outreach-state:refs/remotes/origin/outreach-state
            git worktree add -B outreach-state "$STATE_DIR" origin/outreach-state
          else
            echo "First run: creating the outreach-state branch"
            git worktree add --orphan -b outreach-state "$STATE_DIR"
          fi

      - name: Process run
        timeout-minutes: 330
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: npm run outreach -- run

      - name: Finalize and save state
        if: always()
        timeout-minutes: 8
        run: npm run outreach -- finalize

      - name: Upload evidence (screenshots + CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-evidence
          path: ${{ github.workspace }}/outreach-artifact/
          retention-days: 30
          if-no-files-found: ignore
