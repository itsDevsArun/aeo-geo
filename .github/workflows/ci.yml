name: ci

# Runs on pull requests and on demand only, to save Actions minutes in the private repo.
# Editing outreach/ files on main does not trigger it.
on:
  pull_request:
    paths-ignore: ["outreach/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (real Postgres)
        run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Build for e2e (local test values only)
        run: npm run test:e2e:build
      - name: GitHub-only mode end-to-end (fixture websites only)
        run: npm run test:github
      - name: Browser/UI end-to-end tests of the optional hosted dashboard (fixture websites only)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 3
